# 多平台打包（macOS / Linux）—— 由 GitHub Actions 的对应 runner 构建，
#
# 打完把安装包挂到同一个 Release 上。Windows 的 msi/nsis 仍由本机 scripts\release.ps1 产出。
#
# 为什么必须走 CI：macOS 的 .app/.dmg 只能在 macOS 上打（需要 Xcode 工具链），
# Linux 的 .deb/.AppImage 也需要 Linux 工具链（webkit2gtk 等）—— Windows 上无法交叉出这两类包。
#
# 触发：推 v* 标签（与 Windows 包同一个 Release），或手动 workflow_dispatch。
name: release-mac-linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      # 手动补跑时把产物挂到哪个 Release（留空 = 用当前 ref 名）。
      # 用途：标签早就推过了、或只想补一次 mac/linux 包，不必重新打标签。
      tag:
        description: '要上传到的 Release 标签（如 v1.0.4）'
        required: false
        default: ''

permissions:
  contents: write # 上传 Release 资产

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (aarch64)
            os: macos-latest
            bundles: dmg app
            patterns: |
              target/release/bundle/dmg/*.dmg
              target/release/bundle/macos/*.app
          - name: Linux (x86_64)
            os: ubuntu-22.04
            bundles: deb appimage
            patterns: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
    steps:
      - uses: actions/checkout@v4

      # Linux 的 Tauri 依赖：缺 webkit2gtk / appindicator 的话 bundler 直接失败
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 JDK（宿主 jar 与自带 JRE 都要用）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2

      # [1] 前端产物 —— tauri.conf.json 把 ../../frontend/dist 作为 web/ 打进包
      #
      # 用 `npm install` 而不是 `npm ci`：仓库里的 frontend/package-lock.json 与 package.json
      # 已经不同步（npm ci 会直接拒绝：lock 里的 @rolldown/pluginutils@0.9.0 不满足
      # 需求的 1.0.1 等等）。锁文件该在维护者机器上 `npm install` 重新生成后提交；
      # 在那之前用 install 让 CI 能出包，别把发版卡在锁文件上。
      - name: 构建前端
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      # [2] 四个 Java 宿主 jar —— 缺了它们，装完只有 SQLite 能用（其它类型全报「驱动未就绪」）
      - name: 构建 Java 宿主
        run: |
          for m in jdbc mongodb redis elasticsearch; do
            echo "== dbmind-agent-$m"
            mvn -B -q -DskipTests package -f "agents/dbmind-agent-$m/pom.xml"
          done

      # [3] 自带 JRE（jlink 精简运行时）—— 目标机器不装 Java 也能连库。
      #     模块集与 scripts/release.ps1 保持一致：jdk.charsets 少了会让 Doris 连不上
      #     （MySQL Connector/J 要把 collation 映射成 Java 字符集）。
      - name: 生成自带 JRE
        run: |
          rm -rf dist/jre
          jlink --add-modules java.se,jdk.unsupported,jdk.crypto.ec,jdk.zipfs,jdk.charsets \
            --strip-debug --no-header-files --no-man-pages --compress=zip-6 --output dist/jre
          du -sh dist/jre

      # [4] 桌面安装包。bundle.targets 在 tauri.conf.json 里写的是 msi+nsis（Windows 专用），
      #     这里用 --config 覆盖成当前平台的包型（dmg/app 或 deb/appimage）。
      - name: Tauri 打包
        working-directory: crates/dbmind-desktop
        # 用 --bundles 而不是 --config '{"bundle":{"targets":[...]}}'：后者要塞 JSON，
        # 里面的双引号会被 shell 吃掉（第一跑就撞上了：CLI 收到 `[dmg,app]` 报 JSON 解析错）。
        run: npx --yes '@tauri-apps/cli@^2' build --config tauri.conf.json --bundles ${{ matrix.bundles }}

      - name: 列出产物
        run: find target/release/bundle -type f | sort | head -50

      # [5a] 产物先进 Actions artifacts：即便下面的 Release 上传被跳过（例如手动触发时
      #      没给 tag），包也不会丢，可以事后手动挂上去。
      - name: 上传构建产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-installers
          path: ${{ matrix.patterns }}
          if-no-files-found: warn

      # [5b] 挂到同一个 Release（tag 触发，或手动触发且指定了 tag）。
      #      只新增本平台资产，不动 Windows 那两个。
      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: ${{ matrix.patterns }}
          fail_on_unmatched_files: false
