name: pages

# 官网发布：把 website/ 目录直接部署到 GitHub Pages（替代原来的 legacy Jekyll 构建）。
#
# 为什么不再用 legacy：加图片目录后 legacy 构建反复 "Page build failed"，
# 且失败原因不对外暴露；换成官方 artifact 部署后，构建过程可见、可重跑。
#
# 触发：改动 website/ 的提交进 master，或手动 dispatch。
on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
