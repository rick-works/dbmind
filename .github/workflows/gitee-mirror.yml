# GitHub master → Gitee 镜像：代码 + 全部 tag + 官网内容
# 与 gitee-release.yml（Release 附件同步）互补：这个管 git 数据与官网。
# 官网 = website/ 目录打成孤儿分支 gitee-pages 推过去（Gitee Pages 从该分支发布）。
# 注意：Gitee Pages 免费版没有更新 API，内容更新后要在
# Gitee 仓库 → 服务 → Gitee Pages 里手动点一次「更新」。
name: Gitee 镜像（代码/官网）
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 完整历史，否则推不动 master

      - name: 推送代码与 tag
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/rick-works/dbmind.git"
          # 镜像语义：与 GitHub master 完全一致（含强推），tag 全量对齐
          git push gitee "+refs/heads/master:refs/heads/master"
          git push gitee "+refs/tags/*:refs/tags/*"

      - name: 官网推到 gitee-pages 分支
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          SITE="$RUNNER_TEMP/site"
          mkdir -p "$SITE"
          cp -a website/. "$SITE/"          # -a 连 .nojekyll 等点文件一起带
          cd "$SITE"
          git init -q -b gitee-pages
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "site: sync from master ${GITHUB_SHA}"
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/rick-works/dbmind.git"
          git push -qf gitee gitee-pages
