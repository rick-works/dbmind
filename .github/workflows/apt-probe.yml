# 临时探针：找出在 GitHub 托管 runner 上**真的能装包**的 Ubuntu 镜像。
#
# 由来（2026-11-11）：v2.0.22 / v2.0.23 的 Linux job 连续卡死在 `apt-get update`。
# 日志里真正的报错是 `Temporary failure resolving 'azure.archive.ubuntu.com'`（runner 侧 DNS），
# 而 `apt-get update` **即使所有索引都失败也返回 0** —— 所以判据必须是「真的装上一个包」。
# 结果看 job 日志里的 PASS / FAIL 行。用完即删。
name: apt-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - name: 逐个镜像真装一个包
        run: |
          set -uo pipefail
          CODENAME="$(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")"
          echo "codename=$CODENAME"
          echo "== DNS 检查 =="
          for H in azure.archive.ubuntu.com archive.ubuntu.com mirrors.aliyun.com mirrors.edge.kernel.org mirrors.tuna.tsinghua.edu.cn; do
            printf '%-32s ' "$H"; getent hosts "$H" | head -1 || echo "DNS-FAIL"
          done

          for M in http://azure.archive.ubuntu.com/ubuntu http://archive.ubuntu.com/ubuntu \
                   https://mirrors.edge.kernel.org/ubuntu http://mirrors.aliyun.com/ubuntu \
                   https://mirrors.tuna.tsinghua.edu.cn/ubuntu; do
            echo "== 试 $M =="
            sudo rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
            printf 'deb %s %s main universe\ndeb %s %s-updates main universe\ndeb %s %s-security main universe\n' \
              "$M" "$CODENAME" "$M" "$CODENAME" "$M" "$CODENAME" | sudo tee /etc/apt/sources.list > /dev/null
            sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=12 \
              -o Acquire::https::Timeout=12 -o Acquire::Retries=1 update > /tmp/upd.log 2>&1
            if sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=12 \
                 -o Acquire::Retries=1 install -y --no-install-recommends libxdo-dev > /tmp/ins.log 2>&1; then
              echo "PASS $M"
            else
              echo "FAIL $M"
              grep -Ei 'temporary failure|unable to fetch|could not resolve|failed to fetch' /tmp/ins.log /tmp/upd.log | head -3
            fi
          done
