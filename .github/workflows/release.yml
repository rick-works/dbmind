# 四平台统一打包（Windows / macOS arm64 / macOS Intel / Linux）—— 一套流程、四个 runner，
# 产物挂同一个 Release。
#
# 每个平台的成品清单：
#   Windows  DBmind_<版本>_x64_en-US.msi（msi）、DBmind_<版本>_x64-setup.exe（nsis 安装向导）、
#            dbmind-<版本>-portable.zip（**免安装版**：解压即用，含 jre/ 与 agents/）
#   macOS    DBmind_<版本>_aarch64.dmg / _x64.dmg（+ 同名 .app，.app 本身就是免安装形态：拖进
#            「应用程序」即可，不写任何安装记录）
#   Linux    dbmind_<版本>_amd64.deb（apt 装）、*.AppImage（**免安装**：chmod +x 后直接跑）
#
# 签名：有证书就自动签；没配证书也**不是裸奔** —— macOS 侧会退到 ad-hoc 签名
#   （Apple 芯片要求所有可执行代码至少带 ad-hoc 签名，否则用户双击会被系统拦成"已损坏"），
#   Windows 侧则是未签名安装包（SmartScreen 提示「未知发布者」）。
#   详见 [3c]/[3c-2]/[3d]/[4a] 几步的注释。
#   需要的 Actions secrets（全部可选，逐个独立生效）：
#     APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / KEYCHAIN_PASSWORD  —— mac 签名（必需三件）
#     APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID                           —— mac 公证（可选，配齐才做）
#     WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD                  —— Windows 签名（有 .pfx 时）
#     AZURE_SIGN_ENDPOINT / AZURE_SIGN_ACCOUNT / AZURE_SIGN_PROFILE       —— Windows 云签名（拿不到 .pfx 时）
#     AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_CLIENT_SECRET             —— 上面那套云签名的凭据
#     AZURE_SIGN_DESCRIPTION                                              —— 可选，显示在 UAC 提示里，默认 DBmind
#   生成方式：mac 用 Keychain 导出 .p12 再 `openssl base64 -A`；Windows 用 .pfx 再
#   `certutil -encode`（即 base64）。见 Tauri 官方 Code Signing 文档与 README 的 CI 小节。
#
#   ⚠️ 有效期的现实（决定了你得定期换证书，这不是我们偷懒）：
#     · Windows 代码签名证书：CA/B Forum 的 CSC-31 把上限从 39 个月压到 **460 天**，
#       2026-03-01 起签发的证书一律不得超过 —— 也就是**必须每年换一次**；
#       且 2023-06-01 起私钥必须放在硬件加密模块里，所以新证书多半根本没有 .pfx 可导，
#       这正是上面 Azure 云签名那条路存在的原因。
#     · Apple：**会员资格 $99/年必须持续有效**才能签新包（旧的已签名包不受影响）；
#       Developer ID 证书本身 5 年、描述文件 18 年。证书过期后已签名的包照常运行 ——
#       因为签名里带时间戳，验证的是"签名那一刻证书有效"。
#     · 所以"永久证书"不存在：证书一旦泄露不可撤回，只能靠到期强制失效兜底。
#
# 为什么要统一：macOS 的 .app/.dmg 只能在 macOS 上打（Xcode 工具链），Linux 的 .deb/.AppImage
# 需要 Linux 工具链（webkit2gtk 等），Windows 的 msi/nsis 只能在 Windows 上打 —— 三份机器
# 三套手工步骤，迟早漂移。现在三平台走**同一段 YAML**：同样的前端构建、同样的四个 Java 宿主、
# 同样模块集的 jlink JRE、同样一条 tauri build，只有「包型」和「系统依赖」按平台不同。
#
# 触发：
#   - 推 v* 标签（推荐）：产物自动挂到该标签的 Release
#   - 手动 workflow_dispatch：可指定 tag 输入，给已发布的版本补包（不必重打标签）
#
# 本机 scripts\release.ps1 保留作离线/无网环境下的 Windows 出包（内容与本文件同构）。
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要上传到的 Release 标签（如 v1.0.4）；留空 = 用当前 ref 名'
        required: false
        default: ''

permissions:
  contents: write # 上传 Release 资产

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # 签名相关的值统一提到 job 级：一来 `if:` 里不能直接引用 secrets，但可以引用 env
    # （没配就是空串，所有签名分支自动跳过）；二来 signCommand 由 Tauri 在构建进程里执行，
    # 需要这些变量已经在环境里。GitHub 会把 secrets 值在日志里打码，不会泄漏。
    env:
      AZURE_SIGN_ENDPOINT: ${{ secrets.AZURE_SIGN_ENDPOINT }}
      AZURE_SIGN_ACCOUNT: ${{ secrets.AZURE_SIGN_ACCOUNT }}
      AZURE_SIGN_PROFILE: ${{ secrets.AZURE_SIGN_PROFILE }}
      AZURE_SIGN_DESCRIPTION: ${{ secrets.AZURE_SIGN_DESCRIPTION }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            bundles: msi nsis
            patterns: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*-setup.exe
              dist/dbmind-*-portable.zip
          - name: macOS (aarch64)
            os: macos-latest
            bundles: dmg app
            patterns: |
              target/release/bundle/dmg/*.dmg
              target/release/bundle/macos/*.app
          - name: macOS (x86_64 / Intel)
            # macos-13 已退役；GitHub 现在把编号型标签都给了 Apple 芯片，
            # Intel 必须用带 -intel 后缀的标签（macos-15-intel / macos-26-intel）。
            # 在 Intel runner 上 dtolnay/rust-toolchain 装的就是 x86_64-apple-darwin，
            # 不需要额外 --target，产物自然落到 target/release（非三方 target 目录）。
            os: macos-15-intel
            bundles: dmg app
            patterns: |
              target/release/bundle/dmg/*.dmg
              target/release/bundle/macos/*.app
          - name: Linux (x86_64)
            os: ubuntu-22.04
            bundles: deb appimage
            patterns: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
    steps:
      - uses: actions/checkout@v4

      # Linux 的 Tauri 依赖：缺 webkit2gtk / appindicator 的话 bundler 直接失败
      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libfuse2：AppImage 打包要跑 linuxdeploy（它本身就是个 AppImage），
          # 没有 FUSE 时会直接停在 `failed to run linuxdeploy`；
          # 再加 APPIMAGE_EXTRACT_AND_RUN=1（见下面的 Tauri 步骤）双保险。
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 宿主 jar 要它编译，自带 JRE 要它的 jlink
      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Windows 上显式准备 MSVC 工具链环境（cl.exe / link.exe）。GitHub 的 windows runner
      # 自带 VS，但环境变量要靠它设进当前会话 —— 否则出现「msvc targets depend on the msvc
      # linker but link.exe was not found」这类看着像缺组件的报错。
      - name: 准备 MSVC 环境
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2

      # 下面所有 run 都显式指定 bash：Windows runner 默认是 pwsh，
      # 而这里的循环/路径写法要三平台一致（Git Bash 在 Windows runner 上是现成的）。
      #
      # [1] 前端产物 —— tauri.conf.json 把 ../../frontend/dist 作为 web/ 打进包
      #     用 `npm install` 而不是 `npm ci`：仓库里的 package-lock.json 与 package.json
      #     已经不同步（npm ci 直接拒装），锁文件该由维护者重新生成后提交。
      - name: 构建前端
        shell: bash
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      # [2] 四个 Java 宿主 jar —— 缺了它们，装完只有 SQLite 能用（其它类型全报「驱动未就绪」）
      - name: 构建 Java 宿主
        shell: bash
        run: |
          for m in jdbc mongodb redis elasticsearch; do
            echo "== dbmind-agent-$m"
            mvn -B -q -DskipTests package -f "agents/dbmind-agent-$m/pom.xml"
          done

      # [3] 自带 JRE（jlink 精简运行时）—— 目标机器不装 Java 也能连库。
      #     模块集与 scripts/release.ps1 一致：jdk.charsets 少了会让 Doris 连不上
      #     （MySQL Connector/J 要把 collation 映射成 Java 字符集）。
      - name: 生成自带 JRE
        shell: bash
        run: |
          rm -rf dist/jre
          jlink --add-modules java.se,jdk.unsupported,jdk.crypto.ec,jdk.zipfs,jdk.charsets \
            --strip-debug --no-header-files --no-man-pages --compress=zip-6 --output dist/jre
          du -sh dist/jre

      # [3b] 免安装（绿色）版要的是**全工作区**的 release 产物：dbmind.exe（CLI）、
      #      dbmind-web.exe、dbmind-mcp.exe、dbmind-desktop.exe。tauri build 只编桌面壳
      #      那一个，所以这一步单独跑（增量，tauri build 会复用同一批产物）。
      #      这里**绝不能用 `shell: bash`**：Windows 上 Git Bash 把 /usr/bin 放到 PATH 前面，
      #      rustc 找到的 link.exe 就变成 Git 自带的 coreutils `link`，报
      #      `linking with link.exe failed: exit code 1`（与下面 Tauri 步骤同一个坑，真踩过）。
      - name: 后端打包（release，供免安装版使用）
        if: runner.os == 'Windows'
        run: cargo build --release

      # [3c] 代码签名。证书放 Actions secrets，**没配就跳过并照常出未签名包** ——
      #      包能出才最重要，签名是"有证书时自动升格"。
      #
      #  Windows：base64 的 .pfx 导进 CurrentUser\My，把**指纹**传给下面的配置生成步骤；
      #           Tauri 默认实现会调 Windows SDK 的 signtool 签 exe 与 msi/nsis。
      #  macOS：base64 的 .p12 导进临时 keychain，导出 APPLE_SIGNING_IDENTITY（Tauri 靠它签名）。
      #         公证（notarization）要 Apple ID 三件套；Tauri 判的是"变量**存在**"而不是"非空"，
      #         所以空串绝不能注入 —— 否则它会拿空凭据去公证然后失败，这里只配齐时才写进 GITHUB_ENV。
      #  Linux：deb / AppImage 没有代码签名这回事（只有仓库级 GPG），故无步骤。
      - name: 导入签名证书（Windows，有 secrets 才生效）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "::notice::未配置 WINDOWS_CERTIFICATE：产出未签名安装包（SmartScreen 会提示「未知发布者」）"
            exit 0
          }
          New-Item -ItemType directory -Path certificate -Force | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE -Encoding ASCII
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx 2>$null
          if (-not (Test-Path certificate/certificate.pfx)) {
            # 兜底：有人贴的是"纯 base64"（`openssl base64 -A` 那种一整行，没有 ----- 边界行），
            # 而 certutil -decode 只认带边界行的 PEM 样式 —— 这里自己按 64 字符折行、
            # 补上边界行再解一次，两种贴法都能用。
            $flat = ($env:WINDOWS_CERTIFICATE -replace '[^A-Za-z0-9+/=]', '')
            $wrapped = for ($i = 0; $i -lt $flat.Length; $i += 64) { $flat.Substring($i, [Math]::Min(64, $flat.Length - $i)) }
            @('-----BEGIN CERTIFICATE-----') + $wrapped + @('-----END CERTIFICATE-----') |
              Set-Content -Path certificate/tempCert.txt -Encoding ASCII
            certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          }
          if (-not (Test-Path certificate/certificate.pfx)) { throw 'WINDOWS_CERTIFICATE 解码失败：应为 .pfx 的 base64' }
          $pw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item -Path certificate -Recurse -Force
          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          Write-Host "已导入签名证书：$($cert.Subject)  指纹 $($cert.Thumbprint)"

      # [3c-2] Windows 的另一条签名路：**云签名**（Azure Artifact Signing，原名 Trusted Signing）。
      #        为什么需要它：CA/B Forum 从 2023-06-01 起要求代码签名私钥必须存放在硬件加密模块里，
      #        所以现在新签发的证书通常**根本没有 .pfx 可导**（私钥在令牌或云 HSM 里）。
      #        云签名不导出私钥：Tauri 用 bundle.windows.signCommand 调 CLI，由 Azure 在云端签。
      #        配置齐全才安装（cargo install 要几分钟，没必要每跑都装）。
      - name: 安装 Azure 签到 CLI（Windows，配了云签名才装）
        if: runner.os == 'Windows' && env.AZURE_SIGN_ACCOUNT != ''
        shell: pwsh
        run: |
          cargo install artifact-signing-cli --locked
          artifact-signing-cli --version

      - name: 导入签名证书（macOS，有 secrets 才生效）
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::未配置 APPLE_CERTIFICATE：产出未签名/未公证的 mac 包（用户首次打开要去「隐私与安全性」手动放行）"
            exit 0
          fi
          # secret 里贴的可能是 `certutil -encode` 的输出：带 `-----BEGIN CERTIFICATE-----` /
          # `-----END CERTIFICATE-----` 两行，还可能带换行。GNU 与 BSD 的 base64 都不认这些
          # 非 base64 字符（会直接报错退出），所以先去掉分隔行与所有空白再解码 ——
          # 这样"整段复制粘贴"也能用，不必要求对方手工删头尾。
          printf '%s' "$APPLE_CERTIFICATE" | sed -e '/^-----/d' | tr -d '[:space:]' > certificate.b64
          # macOS 自带 base64 的解码开关是 -D，GNU 的是 -d/--decode，两边都试
          if ! base64 --decode < certificate.b64 > certificate.p12 2>/dev/null; then
            base64 -D < certificate.b64 > certificate.p12 2>/dev/null || base64 -d < certificate.b64 > certificate.p12
          fi
          rm -f certificate.b64
          if [ ! -s certificate.p12 ]; then echo "::error::APPLE_CERTIFICATE 解码失败（应为 .p12 的 base64）"; exit 1; fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # 少了这句，codesign 会弹窗等授权 —— CI 里就是「卡住直到超时」
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f certificate.p12
          security find-identity -v -p codesigning build.keychain
          # 分发用的是 Developer ID Application（App Store 用的 Apple Distribution 在这条路上不行）
          CERT_ID=$(security find-identity -v -p codesigning build.keychain | grep 'Developer ID Application' | head -1 | sed -E 's/^[^"]*"([^"]+)".*/\1/')
          [ -z "$CERT_ID" ] && CERT_ID=$(security find-identity -v -p codesigning build.keychain | head -1 | sed -E 's/^[^"]*"([^"]+)".*/\1/')
          if [ -z "$CERT_ID" ]; then echo "::error::keychain 里没有可用的签名身份"; exit 1; fi
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "::notice::已启用公证（notarization）：$CERT_ID"
          else
            echo "::notice::只签名不公证（缺 APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID 之一）"
          fi

      # [3e] AppImage 打包的必经之路是 linuxdeploy：它用 `ldd <绝对路径>`（继承父进程环境）
      #      逐个解析 AppDir 里每个 ELF 的依赖，**任何一个缺失都直接抛错退出** ——
      #      真机报的是：
      #        Deploying dependencies for ELF file .../jre/lib/librmi.so
      #        ERROR: Could not find dependency: libjvm.so
      #        ERROR: Failed to deploy dependencies for existing files
      #      原因：JDK 把 libjvm.so 放在 jre/lib/server/ 下，由启动器在运行时把它加进搜索路径，
      #      而 jre/lib/*.so 的 RPATH 是 $ORIGIN（也就是 lib/），静态解析当然找不到。
      #      这里在 lib/ 下补一条指向 server/*.so 的软链，ldd 就能在 $ORIGIN 命中；
      #      命中路径本来就在 AppDir 内，linuxdeploy 视为"已部署"，不会再拷一份。
      #      运行时不受影响（JVM 依旧走 lib/server）。deb 不经过 linuxdeploy，加不加都能打。
      - name: 补 JRE 软链以适配 AppImage（Linux）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -d dist/jre/lib/server ]; then
            for f in dist/jre/lib/server/*.so; do
              [ -e "$f" ] || continue
              ln -sf "server/$(basename "$f")" "dist/jre/lib/$(basename "$f")"
              echo "linked lib/$(basename "$f") -> server/$(basename "$f")"
            done
          else
            echo "::warning::dist/jre/lib/server 不存在，跳过（AppImage 可能会因缺 libjvm.so 失败）"
          fi

      # [3d] 生成这一跑要用的 Tauri 配置：以 tauri.conf.json 为底整份复制，Windows 有签名条件时
      #      注入 bundle.windows 的签名配置（两种方式二选一，见下）。**显式 --config 指向这一份**
      #      而不是依赖 CLI 的多配置合并，也避开把 JSON 塞进命令行的老坑（引号会被 shell 吃掉，
      #      真踩过）。tauri.ci.json 与 tauri.conf.json 同目录，里面 ../.. 这类相对路径照旧成立。
      - name: 生成 CI 用 Tauri 配置
        shell: bash
        working-directory: crates/dbmind-desktop
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("tauri.conf.json", "utf8"));
            const thumb = process.env.WINDOWS_CERT_THUMBPRINT || "";
            const azAccount = process.env.AZURE_SIGN_ACCOUNT || "";
            const azProfile = process.env.AZURE_SIGN_PROFILE || "";
            const azEndpoint = process.env.AZURE_SIGN_ENDPOINT || "";
            const azDesc = process.env.AZURE_SIGN_DESCRIPTION || "DBmind";
            let how = "未启用";
            let howMac = "未启用";
            // macOS：没有真证书时给 ad-hoc 签名（伪身份 "-"）兜底。
            // 为什么必须有：Apple 芯片上**所有可执行代码都必须带有效签名**（至少 ad-hoc）才能运行，
            // 否则用户下载后双击会直接被系统拦掉（常见表现是「已损坏，无法打开」）。
            // ad-hoc 签名不能让 Gatekeeper 自动放行（那要真证书 + 公证），但它把"打不开"变成
            // "右键打开 / 到隐私与安全性点仍要打开就能用" —— 这是没证书时的最优解。
            // 真证书在场时（导入步骤会导出 APPLE_SIGNING_IDENTITY）绝不设这个值，否则会顶掉真身份。
            if (process.env.RUNNER_OS === "macOS" && !process.env.APPLE_SIGNING_IDENTITY) {
              cfg.bundle.macOS = Object.assign({}, cfg.bundle.macOS, { signingIdentity: "-" });
              howMac = "ad-hoc（无证书兜底，用户首次打开需手动放行）";
            }
            if (thumb) {
              // 方式一：证书已导入本机证书存储 —— Tauri 默认实现调 Windows SDK 的 signtool，
              // 靠指纹找到它。时间戳（timestamp）必须给：没有它，证书一过期已签名的包就失效。
              cfg.bundle.windows = Object.assign({}, cfg.bundle.windows, {
                certificateThumbprint: thumb,
                digestAlgorithm: "sha256",
                timestampUrl: "http://timestamp.digicert.com",
              });
              how = "本机证书（signtool，指纹 " + thumb.slice(0, 8) + "...）";
            } else if (azAccount && azProfile && azEndpoint) {
              // 方式二：私钥在云 HSM 里（新签发证书的常态），改让 Tauri 调 artifact-signing-cli。
              // 命令直接在这里拼好，不留 $VAR 让 shell 去展开 —— signCommand 由 Tauri 交给
              // Windows 命令行执行，变量展开行为各平台不一致，拼死字符串最稳。
              const desc = azDesc.replace(/"/g, "");
              cfg.bundle.windows = Object.assign({}, cfg.bundle.windows, {
                signCommand: "artifact-signing-cli -e " + azEndpoint + " -a " + azAccount +
                  " -c " + azProfile + " -d \"" + desc + "\" %1",
              });
              how = "Azure Artifact Signing（" + azAccount + " / " + azProfile + "）";
            }
            fs.writeFileSync("tauri.ci.json", JSON.stringify(cfg, null, 2));
            console.log("tauri.ci.json 已生成，Windows 签名 =", how, "| macOS 签名 =", howMac);
          '

      # [4] 桌面安装包。bundle.targets 在 tauri.conf.json 里写的是 msi+nsis（Windows 专用），
      #     这里按平台覆盖包型：Windows=msi nsis / macOS=dmg app / Linux=deb appimage。
      #     用 --bundles 而不是 --config '{"bundle":{"targets":[…]}}'：后者要塞 JSON，
      #     双引号会被 shell 吃掉（真踩过：CLI 收到 `[dmg,app]` 报 JSON 解析错）。
      # ⚠️ 这一步**不能**写 `shell: bash`：在 Windows 上 Git Bash 会把 `/usr/bin` 放到 PATH 前面，
      # 于是 rustc 找到的 `link.exe` 变成 Git 自带的 coreutils `link`
      # （`C:\Program Files\Git\usr\bin\link.exe`，报 `extra operand ...`），而不是 MSVC 链接器。
      # 各平台用默认 shell（Windows=pwsh / 其它=bash）时 PATH 才是对的 —— 真踩过这一脚。
      #
      # 包型用 --bundles 而不是 --config '{"bundle":{"targets":[…]}}'：后者要塞 JSON，
      # 双引号会被 shell 吃掉（CLI 收到 `[dmg,app]` 报 JSON 解析错）。
      - name: Tauri 打包
        working-directory: crates/dbmind-desktop
        env:
          # linuxdeploy / linuxdeploy-plugin-appimage 都是 AppImage：让它们解包运行，
          # 不依赖挂载（FUSE）—— CI 容器里挂载经常不可用。
          APPIMAGE_EXTRACT_AND_RUN: 1
        # `-v` 不只是"多打日志"这么简单：Tauri 的 AppImage 打包在默认（Error）级别下会把
        # linuxdeploy 的 stdout/stderr 整段丢掉，只回一句固定文案 `failed to run linuxdeploy`，
        # 完全没有可诊断信息；提到 verbose 才会走 output_ok 分支把子进程输出打出来。
        run: npx --yes '@tauri-apps/cli@^2' build -v --config tauri.ci.json --bundles ${{ matrix.bundles }}

      # [4a'] AppImage 失败时的兜底诊断：拿 Tauri 下载的同版 linuxdeploy，对着它留下的
      #       AppDir 原样再跑一遍，把 stderr 完整打出来（Tauri 自己会吞掉）。
      - name: 诊断 AppImage（仅 Linux 失败时）
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: |
          echo "== bundle/appimage 目录"
          ls -la target/release/bundle/appimage 2>&1 | head -20
          LD=$(find "$HOME/.cache/tauri" -name 'linuxdeploy-*.AppImage' 2>/dev/null | head -1)
          APPDIR=$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppDir' 2>/dev/null | head -1)
          echo "linuxdeploy = $LD"
          echo "appdir      = $APPDIR"
          if [ -n "$LD" ] && [ -n "$APPDIR" ]; then
            chmod +x "$LD"
            echo "== 手动复跑（verbosity 2）"
            APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 OUTPUT=/tmp/diag.AppImage \
              "$LD" --appimage-extract-and-run --verbosity 2 \
              --appdir "$PWD/$APPDIR" --plugin gtk --output appimage 2>&1 | tail -80 || true
          fi
          echo "== 资源"
          df -h /tmp | tail -1
          free -m

      # [4a-0] macOS 依赖体检：主可执行文件里**不允许**出现 /opt/homebrew 或 /usr/local 下的
      #        动态库。这一关是 v1.2.0 崩出来的教训 —— libssh2 在 unix 上默认链**系统的**
      #        OpenSSL，CI 里就链到 Homebrew 的 /opt/homebrew/opt/openssl@3/lib/libssl.3.dylib，
      #        用户的 M1 上要么没有它、要么 hardened runtime 的库校验不认它的 Team ID，
      #        双击直接崩在 DYLD 的 Library not loaded。
      #        现在由 dbmind-core 的 ssh2/vendored-openssl 静态链（见 crates/dbmind-core/Cargo.toml），
      #        这里守住别退回去。纯读 otool，不依赖网络、不依赖证书。
      - name: 检查 macOS 二进制不含本机第三方动态库
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$app" ]; then echo "::error::没找到 .app 产物"; exit 1; fi
          echo "app = $app"
          fail=0
          for exe in "$app"/Contents/MacOS/*; do
            [ -f "$exe" ] || continue
            echo "== otool -L $exe"
            otool -L "$exe"
            bad=$(otool -L "$exe" | tail -n +2 | awk '{print $1}' | grep -E '^(/opt/homebrew|/usr/local)' || true)
            if [ -n "$bad" ]; then
              echo "::error::$exe 链到了本机第三方动态库（用户机器上不会有）：$bad"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "OK：没有 /opt/homebrew、/usr/local 下的动态依赖"

      # [4b] 用 dmgbuild 重做 DMG 外观（macOS）。
      #      为什么不用 Tauri 自带的：CI 上 Tauri 给 create-dmg 传 --skip-jenkins，
      #      跳过"设窗口背景与图标位置"的 AppleScript（headless runner 上 Finder 自动化不可靠），
      #      于是 DMG 就是「两个图标堆在左上角」的朴素窗口（用户反馈"安装的页面不对"）。
      #      dmgbuild 自己写 .DS_Store、不经过 Finder，所以能在这里跑出正常的拖拽布局。
      #      **失败一律只告警**：宁可出一个朴素但可用的 DMG，也不能因为外观把整包卡住。
      - name: 重做 DMG 外观（dmgbuild，macOS）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          dmg=$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -1)
          if [ -z "$app" ] || [ -z "$dmg" ]; then
            echo "::warning::没有 .app 或 .dmg，跳过外观重做"
            exit 0
          fi
          echo "app = $app"
          echo "dmg = $dmg"
          python3 -m pip install --quiet --user dmgbuild \
            || { echo "::warning::装不上 dmgbuild，保留 Tauri 原样 DMG"; exit 0; }
          out="$RUNNER_TEMP/DBmind-styled.dmg"
          if python3 -m dmgbuild -s scripts/dmg-settings.py "DBmind" "$out"; then
            cp "$out" "$dmg"
            echo "已用 dmgbuild 重做 DMG 外观"
          else
            echo "::warning::dmgbuild 出错，保留 Tauri 原样 DMG（功能不受影响）"
          fi

      # [4a-1] DMG 布局体检：用户要的是「把图标拖进应用程序」那种安装方式，那么 DMG 挂载后
      #        根目录必须同时有 .app 和一个指向 /Applications 的软链。这里挂上去实看一眼并把
      #        目录列出来 —— 缺软链只告警不失败（先让包出得去），但日志里能一眼看到真相。
      - name: 检查 DMG 的安装布局（macOS）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg=$(find target/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -1)
          if [ -z "$dmg" ]; then echo "::warning::没找到 dmg 产物"; exit 0; fi
          echo "dmg = $dmg"
          mnt=$(hdiutil attach "$dmg" -nobrowse -readonly | tail -1 | awk '{print $NF}')
          echo "挂载点 = $mnt"
          ls -la "$mnt"
          if [ -L "$mnt/Applications" ]; then
            echo "OK：有指向 /Applications 的软链，是「拖进应用程序」的布局"
          else
            echo "::warning::DMG 根目录里没有 Applications 软链 —— 用户没法直接拖进去安装"
          fi
          hdiutil detach "$mnt" -quiet || true

      # [4a] 签名是"有证书才发生"的，所以必须显式**验证**一次：否则未签名的包会被静默发出去，
      #      而用户那边只看到"未知发布者"/"已损坏"这类模糊症状。
      #      判断证书在不在放在脚本里（GITHUB_ENV 写的变量就是普通环境变量，最稳），
      #      不写进 if：免得踩 `env` 上下文有没有刷新到上一步写出的值这种细节。
      - name: 验证签名（macOS）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for app in target/release/bundle/macos/*.app; do
            [ -d "$app" ] || continue
            # 无论有没有真证书，签名都必须能校验通过：无证书时我们给的是 ad-hoc 签名，
            # 它在 Apple 芯片上是"能不能被打开"的前提，所以这里不能跳过。
            codesign --verify --deep --strict --verbose=2 "$app" && echo "codesign 校验通过"
            codesign -dv --verbose=4 "$app" 2>&1 | grep -E 'Authority|TeamIdentifier|Signature' || true
            if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
              echo "== 公证票据"
              xcrun stapler validate "$app" && echo "stapler: OK"
            else
              echo "::notice::未配证书：本包是 ad-hoc 签名（能打开，但 Gatekeeper 不会自动放行）"
            fi
          done

      - name: 验证签名（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERT_THUMBPRINT -and -not $env:AZURE_SIGN_ACCOUNT) {
            Write-Host "未签名构建，跳过校验"
            exit 0
          }
          $files = @()
          $files += Get-ChildItem target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue
          $files += Get-ChildItem target/release/bundle/nsis/*-setup.exe -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host ("{0}  status={1}  signer={2}" -f $f.Name, $sig.Status, $sig.SignerCertificate.Subject)
            if ($sig.Status -ne 'Valid') { throw ("签名无效：" + $f.FullName) }
          }

      # 注意别写成 `find ... | sort | head -50`：GitHub 的 bash 默认带 -o pipefail，
      # head 读够行数就退出，find/sort 拿到 SIGPIPE 以非 0 退出，整步就"莫名失败"
      # （曾在 mac 上看到 `Process completed with exit code 2`，产物其实好好的）。
      # 用 sed -n '1,50p' 读完所有输入，就不会有这个问题。
      - name: 列出产物
        shell: bash
        run: find target/release/bundle -type f 2>/dev/null | sort | sed -n '1,50p' || true

      # [4b] Windows 免安装（绿色）版：解压即用，不写注册表、不需要安装。
      #      复用本机 scripts\package.ps1 的组装逻辑（同一份清单，避免两处漂移）：
      #      exe ×4 + agents/ + web/ + start.bat + README/LICENSE。
      #      它**不含** jre/，所以这里按 release.ps1 的做法补上 dist\jre —— 否则目标机器
      #      没装 Java 17+ 时，SQL Server / Mongo / Redis / ES / JDBC 一律「驱动未就绪」。
      #      压缩用 tar.exe -a（bsdtar 自带 zip 支持），比 Compress-Archive 快一个量级。
      - name: 组装免安装版并压缩（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package.ps1 -SkipCargo -SkipAgents -SkipFrontend
          $ver = (Select-String -Path Cargo.toml -Pattern '(?m)^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          Copy-Item dist/jre "dist/dbmind-$ver/jre" -Recurse -Force
          tar.exe -a -c -f "dist/dbmind-$ver-portable.zip" -C dist "dbmind-$ver"
          Get-ChildItem "dist/dbmind-$ver-portable.zip" | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      # [5a] 产物先进 Actions artifacts：即便下面的 Release 上传被跳过（手动触发没给 tag），
      #      包也不会丢，可以事后手动挂上去。用 always()：一个平台里「deb 成了、appimage 挂了」
      #      这种部分成功也要把已出的包留下来。
      - name: 上传构建产物（artifact）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-installers
          path: ${{ matrix.patterns }}
          if-no-files-found: warn

      # [5b] 挂到同一个 Release（tag 触发，或手动触发且指定了 tag）。
      #      同样 always()：部分产物先挂上去，好过整批丢掉。
      - name: 上传到 Release
        if: always() && (startsWith(github.ref, 'refs/tags/') || inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: ${{ matrix.patterns }}
          fail_on_unmatched_files: false
