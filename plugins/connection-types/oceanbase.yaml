schemaVersion: 1
order: 1460
dbType: oceanbase
rustVariant: Oceanbase
label: OceanBase
# OceanBase（MySQL 模式）：协议与语法层兼容 MySQL 5.7/8.0，
# 方言分支、模块路由、驱动全部复用 MySQL 那一套。
# 注意：Oracle 模式是另一套方言，不在本类型覆盖范围（用到再单开）。
dialect: MySQL
runtimeMode: agent
mcpMode: bridge
# MySQL 模式直接用 MySQL 驱动（OB 官方也推荐 MySQL Connector/J）
agentKey: mysql
driverStoreVisible: true
driverStoreOrder: 16
singleConnectionPool: false
metadataConnectionScoped: false
# 分布式库，连接池与 TiDB 同理开宽一点
maxConnections: 8
skipTcpProbe: false
localFile: false
# OBProxy / MySQL 租户默认端口 2881
defaultPort: 2881
jdbc:
  driverClass: com.mysql.cj.jdbc.Driver
  urlTemplate: "jdbc:mysql://{host}:{port}/{database}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=600000&rewriteBatchedStatements=true&useCursorFetch=true&zeroDateTimeBehavior=CONVERT_TO_NULL&allowMultiQueries=true"
  artifact: com.mysql:mysql-connector-j:9.1.0
traits:
  singleDatabase: false
  schemaAware: false
supportLevel: operate
capabilities:
  queryExecution: true
  metadataBrowse: true
  objectBrowser: true
  objectSource: true
  schemaSearch: true
  diagram: true
  tableDataEdit: true
  tableStructureEdit: true
  tableImport: true
  dataTransfer: true
  sqlFileExecution: true
  databaseCreate: true
  fieldLineage: false
  sqlExplain: true
  userAdmin: true
  driverManagement: true
