schemaVersion: 1
order: 100
dbType: sqlite
rustVariant: Sqlite
label: SQLite
dialect: SQLite
runtimeMode: native
mcpMode: bridge
driverStoreVisible: true
driverStoreOrder: 1
singleConnectionPool: true
metadataConnectionScoped: false
skipTcpProbe: true
localFile: true
traits:
  singleDatabase: true
  schemaAware: false
supportLevel: full
capabilities:
  queryExecution: true
  metadataBrowse: true
  objectBrowser: true
  objectSource: true
  schemaSearch: true
  diagram: true
  tableDataEdit: true
  tableStructureEdit: true
  tableImport: true
  dataTransfer: false
  sqlFileExecution: true
  databaseCreate: true
  fieldLineage: false
  sqlExplain: true
  userAdmin: false
  driverManagement: false
# SQLite 的「备份」就是 `.dump` 成 SQL 脚本。
backup:
  engine: SQLite
  tool: sqlite3
  restoreTool: sqlite3
  package: sqlite
  # sqlite3 靠 shell 重定向读写单文件，不走参数拼装
  argStyle: sqliteFile
  dumpHint: 'sqlite3 "{sqliteFile}" .dump > "{filePath}"'
  restoreHint: 'sqlite3 "{sqliteFile}" < "{filePath}"'
