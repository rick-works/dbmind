schemaVersion: 1
order: 1100
dbType: kingbase
rustVariant: Kingbase
label: 人大金仓 KingbaseES
dialect: PostgreSQL
runtimeMode: agent
mcpMode: bridge
agentKey: kingbase
driverStoreVisible: true
driverStoreOrder: 11
singleConnectionPool: false
metadataConnectionScoped: false
maxConnections: 8
skipTcpProbe: false
localFile: false
defaultPort: 54321
jdbc:
  driverClass: com.kingbase8.Driver
  # 与 PostgreSQL 同源，默认参数见 postgresql.yaml
  urlTemplate: "jdbc:kingbase8://{host}:{port}/{database}?sslmode=prefer&reWriteBatchedInserts=true&stringtype=unspecified&tcpKeepAlive=true"
  artifact: cn.com.kingbase:kingbase8:9.0.0
traits:
  singleDatabase: false
  schemaAware: true
supportLevel: operate
capabilities:
  queryExecution: true
  metadataBrowse: true
  objectBrowser: true
  objectSource: true
  schemaSearch: true
  diagram: true
  tableDataEdit: true
  tableStructureEdit: true
  tableImport: true
  dataTransfer: true
  sqlFileExecution: true
  databaseCreate: true
  fieldLineage: false
  sqlExplain: true
  userAdmin: true
  driverManagement: true
# 金仓自带一套 `sys_*` 客户端（不吃 pg_dump 的目录差异），所以单独声明，不继承 PG。
backup:
  engine: KingbaseES
  tool: sys_dump
  restoreTool: ksql
  package: kingbase-client
  dumpHint: 'sys_dump -h {host} -p {port} -U {user} -f "{filePath}" {database}'
  restoreHint: 'ksql -h {host} -p {port} -U {user} -d {database} -f "{filePath}"'
