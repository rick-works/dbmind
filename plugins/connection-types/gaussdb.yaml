schemaVersion: 1
order: 1480
dbType: gaussdb
rustVariant: Gaussdb
label: 华为 GaussDB
# GaussDB 与 openGauss 同源（openGauss 是它的开源版），对外是 **openGauss/PG 协议**：
# 方言、模块路由复用 PostgreSQL，驱动复用 openGauss 的 JDBC fork。
# ⚠️ **不能换成 PG 官方驱动**：GaussDB/openGauss 默认口令加密是 sha256，
# PG 驱动不会算，会直接登录被拒（openGauss 真机踩过）。
dialect: PostgreSQL
runtimeMode: agent
mcpMode: bridge
# 与 openGauss 共用驱动目录与宿主（同一个 artifact，装一次两边都能用）
agentKey: opengauss
driverStoreVisible: true
driverStoreOrder: 24
singleConnectionPool: false
metadataConnectionScoped: false
# 分布式版并发高；单机版给 8 也够（判断，非实测）
maxConnections: 8
skipTcpProbe: false
localFile: false
# GaussDB 分布式版默认 8000，单机/主备版常见 5432 —— 以现场部署为准
defaultPort: 8000
jdbc:
  driverClass: org.opengauss.Driver
  # sslmode=disable：容器/远程直连时 SSL 协商容易卡死握手（openGauss 实测 08P01）
  urlTemplate: "jdbc:opengauss://{host}:{port}/{database}?sslmode=disable"
  artifact: org.opengauss:opengauss-jdbc:5.0.0-og
traits:
  singleDatabase: false
  schemaAware: true
# 2026-11-17 **同族实例**（openGauss 5.0.0，GaussDB 的开源版）逐项验证：24 项只读 + 上述 7 项写库全通过。
#
# ⛔ 2026-11-17 起对前端隐藏（exposed: false）：只有「同族 openGauss 协议层」验证，
# 没有真机 GaussDB（商业交付，需华为授权/云服务，无公开安装包）。
# 另：GaussDB 是多产品线（集中式 5432 / DWS 8000 / M 版要 com.huawei.gaussdb.jdbc.Driver
# 且 sha256 是私有握手），本文件目前只覆盖「集中式 + openGauss 驱动」这一档，
# 拿到真机后应先确认产品线与驱动再拆配置。
exposed: false
supportLevel: operate
capabilities:
  queryExecution: true
  metadataBrowse: true
  objectBrowser: true
  objectSource: true
  schemaSearch: true
  diagram: true
  tableDataEdit: true
  tableStructureEdit: true
  tableImport: true
  dataTransfer: true
  sqlFileExecution: true
  databaseCreate: true
  fieldLineage: false
  sqlExplain: true
  userAdmin: true
  driverManagement: true
