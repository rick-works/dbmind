schemaVersion: 1
order: 700
dbType: oracle
rustVariant: Oracle
label: Oracle
dialect: Oracle
runtimeMode: agent
mcpMode: bridge
agentKey: oracle
driverStoreVisible: true
driverStoreOrder: 7
singleConnectionPool: false
metadataConnectionScoped: false
maxConnections: 8
skipTcpProbe: false
localFile: false
defaultPort: 1521
jdbc:
  driverClass: oracle.jdbc.OracleDriver
  urlTemplate: "jdbc:oracle:thin:@{host}:{port}/{database}"
  artifact: com.oracle.database.jdbc:ojdbc11:23.6.0.24.10
traits:
  singleDatabase: false
  schemaAware: true
supportLevel: operate
capabilities:
  queryExecution: true
  metadataBrowse: true
  objectBrowser: true
  objectSource: true
  schemaSearch: true
  diagram: true
  tableDataEdit: true
  tableStructureEdit: true
  tableImport: true
  dataTransfer: true
  sqlFileExecution: true
  databaseCreate: false
  fieldLineage: false
  sqlExplain: true
  userAdmin: true
  driverManagement: true
# 命令行备份走数据泵（expdp/impdp）。DM 同为 Oracle 方言但工具不同，在 dm.yaml 里单独声明。
backup:
  engine: Oracle
  tool: expdp
  restoreTool: impdp
  package: oracle-instantclient
  # expdp / impdp 需要服务端目录对象与凭据配合，内核还没实现 argv 拼装：
  # 这里只登记工具名用于「是否就绪」探测，实际备份走内置引擎
  argStyle: none
  dumpHint: 'expdp {user}/******@{host}:{port}/{database} DIRECTORY=DATA_PUMP_DIR DUMPFILE={filePath} FULL=Y'
  restoreHint: 'impdp {user}/******@{host}:{port}/{database} DIRECTORY=DATA_PUMP_DIR DUMPFILE={filePath} FULL=Y'
