schemaVersion: 1
order: 600
dbType: sqlserver
rustVariant: Sqlserver
label: SQL Server
dialect: SqlServer
runtimeMode: agent
mcpMode: bridge
agentKey: sqlserver
driverStoreVisible: true
driverStoreOrder: 6
# SQL Server 是网络型库：一个库正常运行几十条连接是常态，**没有**「连接池只有一条」这回事。
# 这里原本是 true（初始化提交起就在，无注释说明原因），代价是 write_parallelism=1 →
# 整库同步的对象并发被 `(write_parallelism/2).max(1)` 压成「一次只搬 1 张表」；
# 4 表 × 400 行实测严格串行、12.9s（日志「并发 1 张表，每表最多 1 路写」）。
# 改成 false 后：4 张表并发 × 每表 1 路写，4 表 × 5000 行 8.7s 全量落库；
# 二次 upsert 也验过（改 10 行 + 新增 10 行：更新生效、无重复 id、零失败行）。
singleConnectionPool: false
metadataConnectionScoped: true
skipTcpProbe: false
localFile: false
defaultPort: 1433
jdbc:
  driverClass: com.microsoft.sqlserver.jdbc.SQLServerDriver
  # encrypt=false + trustServerCertificate=true：兼容纯 JDBC 自签环境。
  # 少了这两个参数，mssql-jdbc 12.x 的默认是 encrypt=true / trustServerCertificate=false，
  # 连自签证书的库会直接报 PKIX path building failed —— 界面上却看不出来是参数问题。
  # allowMultiQueries=true：一条请求里可能带多条语句（脚本执行 / 批量 DDL），
  # 缺了它 mssql-jdbc 会拒掉「一次多发」的语句。表单预览按这条模板逐字展示。
  urlTemplate: "jdbc:sqlserver://{host}:{port};databaseName={database};encrypt=false;trustServerCertificate=true;loginTimeout=10;allowMultiQueries=true"
  artifact: com.microsoft.sqlserver:mssql-jdbc:12.8.1.jre11
traits:
  singleDatabase: false
  schemaAware: true
supportLevel: operate
capabilities:
  queryExecution: true
  metadataBrowse: true
  objectBrowser: true
  objectSource: true
  schemaSearch: true
  diagram: true
  tableDataEdit: true
  tableStructureEdit: true
  tableImport: true
  dataTransfer: true
  sqlFileExecution: true
  databaseCreate: true
  fieldLineage: false
  sqlExplain: true
  userAdmin: true
  driverManagement: true
