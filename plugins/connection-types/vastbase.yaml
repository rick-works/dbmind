schemaVersion: 1
order: 320
dbType: vastbase
rustVariant: Vastbase
label: 海量 Vastbase
# Vastbase（海量数据 Vastbase G100）基于 PostgreSQL 内核：方言、模块路由复用
# PostgreSQL 那一套，驱动用 PG 官方 JDBC。
# ⚠️ Vastbase 也有自己的原生 JDBC（cn.com.vastbase:...），本类型刻意用 PG 驱动：
# 复用已下载的驱动、零额外依赖；若现场要求原生驱动，可在设置页手动上传覆盖。
dialect: PostgreSQL
runtimeMode: agent
mcpMode: bridge
agentKey: postgresql
driverStoreVisible: true
driverStoreOrder: 22
singleConnectionPool: false
metadataConnectionScoped: false
maxConnections: 8
skipTcpProbe: false
localFile: false
defaultPort: 5432
jdbc:
  driverClass: org.postgresql.Driver
  urlTemplate: "jdbc:postgresql://{host}:{port}/{database}?sslmode=prefer&reWriteBatchedInserts=true&stringtype=unspecified&tcpKeepAlive=true"
  artifact: org.postgresql:postgresql:42.7.4
traits:
  singleDatabase: false
  schemaAware: true
# 2026-11-17 **真机验证**：实验室 Vastbase G100 2.2.15（容器 lab-vastbase:25432），
# 连接/库表/列/索引/DDL/数据/SQL(建库建表增删改 ALTER)/导出/用户角色/监控全通；
# 24 项巡检 21 通过，仅 3 项系统审计表 audit.vb_audit_log 失败（openGauss 同源行为，非缺陷）。
# 另证实：pg_hba 用 sha256 时 PG JDBC 可直连（与 openGauss 的 sha256 不同，无需换驱动）。
supportLevel: operate
capabilities:
  queryExecution: true
  metadataBrowse: true
  objectBrowser: true
  objectSource: true
  schemaSearch: true
  diagram: true
  tableDataEdit: true
  tableStructureEdit: true
  tableImport: true
  dataTransfer: true
  sqlFileExecution: true
  databaseCreate: true
  fieldLineage: false
  sqlExplain: true
  userAdmin: true
  driverManagement: true
