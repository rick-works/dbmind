schemaVersion: 1
order: 1200
dbType: doris
rustVariant: Doris
label: Apache Doris
dialect: MySQL
runtimeMode: agent
mcpMode: bridge
agentKey: doris
driverStoreVisible: true
driverStoreOrder: 12
singleConnectionPool: false
metadataConnectionScoped: false
# 并发上限：MPP 分析库，查询天然并发；连接开销低 ⇒ 给 8。
# 这是判断，不是实测（本机没有集群可压）。
maxConnections: 8
skipTcpProbe: false
localFile: false
defaultPort: 9030
jdbc:
  driverClass: com.mysql.cj.jdbc.Driver
  # Doris 走 MySQL 协议与 MySQL 驱动，参数与 mysql 同款
  urlTemplate: "jdbc:mysql://{host}:{port}/{database}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=600000&rewriteBatchedStatements=true&useCursorFetch=true&zeroDateTimeBehavior=CONVERT_TO_NULL&allowMultiQueries=true"
  # ⚠️ 刻意用 8.0.28，而不是跟 MySQL 一样的 9.1.0：
  #    8.0.31 起驱动改了坐标（com.mysql:mysql-connector-j）与字符集解析，对 Doris 的握手
  #    会误判服务端字符集编号，连接直接失败并报 `Unknown character set: 'eucjpms'`（实测）。
  #    Doris 与 MySQL 共享 doris 驱动目录，必须与 StarRocks/SelectDB 同坐标同文件：
  #    老驱动 8.0.28 不认 Doris 返回的 charset 名（Unknown character set: 'eucjpms'）。
  artifact: com.mysql:mysql-connector-j:9.1.0
traits:
  singleDatabase: false
  # catalog→库→表 三层，没有「库.模式」二级结构（真机 information_schema.tables 的
  # table_schema 就是裸库名）。写 true 会让 MCP 把 catalog.库 拆成库+模式而查不到表。
  schemaAware: false
supportLevel: operate
capabilities:
  queryExecution: true
  metadataBrowse: true
  objectBrowser: true
  objectSource: true
  schemaSearch: true
  diagram: true
  tableDataEdit: true
  tableStructureEdit: true
  tableImport: true
  dataTransfer: true
  sqlFileExecution: true
  databaseCreate: true
  fieldLineage: false
  sqlExplain: true
  userAdmin: true
  driverManagement: true
