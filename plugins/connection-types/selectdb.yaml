schemaVersion: 1
order: 1210
dbType: selectdb
rustVariant: Selectdb
label: SelectDB
# SelectDB 是 Apache Doris 的商业发行版（云原生 MPP 分析库），MySQL 协议与
# Doris 一致：方言、模块路由、驱动全部复用 Doris 那一套（agentKey 也指向 doris）。
# ⚠️ 驱动沿用 Doris 的 8.0.28 老坐标，理由见 doris.yaml：新版 Connector/J
# 会把 Doris 系的字符集编号读错，握手直接报 Unknown character set: 'eucjpms'。
dialect: MySQL
runtimeMode: agent
mcpMode: bridge
agentKey: doris
driverStoreVisible: true
driverStoreOrder: 20
singleConnectionPool: false
metadataConnectionScoped: false
# 分析型 MPP 库，连接开销低（同 Doris / StarRocks）
maxConnections: 8
skipTcpProbe: false
localFile: false
# FE 查询端口与 Doris 相同
defaultPort: 9030
jdbc:
  driverClass: com.mysql.cj.jdbc.Driver
  urlTemplate: "jdbc:mysql://{host}:{port}/{database}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=600000&rewriteBatchedStatements=true&useCursorFetch=true&zeroDateTimeBehavior=CONVERT_TO_NULL&allowMultiQueries=true"
  # 与 Doris/StarRocks 共享 doris 驱动目录，坐标必须一致（否则就绪检查互相打架）
  artifact: com.mysql:mysql-connector-j:9.1.0
traits:
  singleDatabase: false
  # 与 Doris 同源（catalog→库→表，无「库.模式」），真机以 Doris 2.1.8 代验，写 true 会拆坏带点库名。
  schemaAware: false
# 2026-11-17 **同族实例**（Apache Doris 2.1.8，SelectDB 是其商业发行版）逐项验证：24 项只读 + 上述 7 项写库全通过。
#
# ⛔ 2026-11-17 起对前端隐藏（exposed: false）：只有「同族 Doris 协议层」验证，
# 没有真机 SelectDB（企业版 30 天试用要填表发邮箱，没有可运行的公开镜像）。
# 拿到真实实例、跑通闭环之后再改回 true。
exposed: false
supportLevel: operate
capabilities:
  queryExecution: true
  metadataBrowse: true
  objectBrowser: true
  objectSource: true
  schemaSearch: true
  diagram: true
  tableDataEdit: true
  tableStructureEdit: true
  tableImport: true
  dataTransfer: true
  sqlFileExecution: true
  databaseCreate: true
  fieldLineage: false
  sqlExplain: true
  userAdmin: true
  driverManagement: true
