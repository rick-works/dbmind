schemaVersion: 1
order: 1250
dbType: tidb
rustVariant: Tidb
label: TiDB
# TiDB 完全兼容 MySQL 协议：方言分支、模块路由、驱动都复用 MySQL 那一套，
# 所以这个类型只需要一份声明 —— 内核/前端都没有为它加过一行代码。
dialect: MySQL
runtimeMode: agent
mcpMode: bridge
# 与 MariaDB 同理：复用 MySQL 驱动目录与宿主，用户装了 MySQL 驱动就能直接连 TiDB，
# 不用再下一份一模一样的 Connector/J。
agentKey: mysql
driverStoreVisible: true
driverStoreOrder: 13
singleConnectionPool: false
metadataConnectionScoped: false
# 分布式数据库，连接池开得比单机 MySQL 宽一点（TiDB 侧默认 max_connections 很大）。
maxConnections: 8
skipTcpProbe: false
localFile: false
# TiDB 默认端口 4000（不是 MySQL 的 3306）
defaultPort: 4000
jdbc:
  driverClass: com.mysql.cj.jdbc.Driver
  urlTemplate: "jdbc:mysql://{host}:{port}/{database}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=600000&rewriteBatchedStatements=true&useCursorFetch=true&zeroDateTimeBehavior=CONVERT_TO_NULL&allowMultiQueries=true"
  artifact: com.mysql:mysql-connector-j:9.1.0
traits:
  singleDatabase: false
  schemaAware: false
supportLevel: operate
capabilities:
  queryExecution: true
  metadataBrowse: true
  objectBrowser: true
  objectSource: true
  schemaSearch: true
  diagram: true
  tableDataEdit: true
  tableStructureEdit: true
  tableImport: true
  dataTransfer: true
  sqlFileExecution: true
  databaseCreate: true
  fieldLineage: false
  sqlExplain: true
  userAdmin: true
  driverManagement: true
