schemaVersion: 1
order: 330
dbType: uxdb
rustVariant: Uxdb
label: 优炫 UXDB
# UXDB（优炫数据库）基于 PostgreSQL 内核：方言、模块路由复用 PostgreSQL，
# 驱动直接用 PG 官方 JDBC，复用同一份驱动目录。
dialect: PostgreSQL
runtimeMode: agent
mcpMode: bridge
agentKey: postgresql
driverStoreVisible: true
driverStoreOrder: 23
singleConnectionPool: false
metadataConnectionScoped: false
maxConnections: 8
skipTcpProbe: false
localFile: false
defaultPort: 5432
jdbc:
  driverClass: org.postgresql.Driver
  urlTemplate: "jdbc:postgresql://{host}:{port}/{database}?sslmode=prefer&reWriteBatchedInserts=true&stringtype=unspecified&tcpKeepAlive=true"
  artifact: org.postgresql:postgresql:42.7.4
traits:
  singleDatabase: false
  schemaAware: true
supportLevel: experimental
capabilities:
  queryExecution: true
  metadataBrowse: true
  objectBrowser: true
  objectSource: true
  schemaSearch: true
  diagram: true
  tableDataEdit: true
  tableStructureEdit: true
  tableImport: true
  dataTransfer: true
  sqlFileExecution: true
  databaseCreate: true
  fieldLineage: false
  sqlExplain: true
  userAdmin: true
  driverManagement: true
