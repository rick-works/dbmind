schemaVersion: 1
order: 330
dbType: uxdb
rustVariant: Uxdb
label: 优炫 UXDB
# UXDB（优炫数据库）基于 PostgreSQL 内核：方言、模块路由复用 PostgreSQL，
# 驱动直接用 PG 官方 JDBC，复用同一份驱动目录。
dialect: PostgreSQL
runtimeMode: agent
mcpMode: bridge
agentKey: postgresql
driverStoreVisible: true
driverStoreOrder: 23
singleConnectionPool: false
metadataConnectionScoped: false
maxConnections: 8
skipTcpProbe: false
localFile: false
# 优炫官方部署指南与 DBX 的 profile 都用 52025（不是 PG 惯用的 5432）
defaultPort: 52025
jdbc:
  driverClass: org.postgresql.Driver
  urlTemplate: "jdbc:postgresql://{host}:{port}/{database}?sslmode=prefer&reWriteBatchedInserts=true&stringtype=unspecified&tcpKeepAlive=true"
  artifact: org.postgresql:postgresql:42.7.4
traits:
  singleDatabase: false
  schemaAware: true
# 2026-11-17 **同族实例**（PostgreSQL 16.15，UXDB 基于 PostgreSQL 内核）逐项验证：24 项只读 + 上述 7 项写库全通过。
#
# 2026-11-17 起对前端隐藏（exposed: false）：只有同族 PG 协议层验证，
# 没有真机 UXDB（社区版安装包公开，但启动必须厂商 License，绑定硬件）。
# UXDB 另自带驱动 com.uxsino.uxdb.Driver + jdbc:uxdb://，本文件仍用 PG 驱动，
# 拿到真机后先试 PG 驱动，失败再换厂商驱动。
exposed: false
supportLevel: operate
capabilities:
  queryExecution: true
  metadataBrowse: true
  objectBrowser: true
  objectSource: true
  schemaSearch: true
  diagram: true
  tableDataEdit: true
  tableStructureEdit: true
  tableImport: true
  dataTransfer: true
  sqlFileExecution: true
  databaseCreate: true
  fieldLineage: false
  sqlExplain: true
  userAdmin: true
  driverManagement: true
