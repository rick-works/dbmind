schemaVersion: 1
order: 300
dbType: postgresql
rustVariant: Postgresql
label: PostgreSQL
dialect: PostgreSQL
runtimeMode: agent
mcpMode: bridge
agentKey: postgresql
driverStoreVisible: true
driverStoreOrder: 3
singleConnectionPool: false
metadataConnectionScoped: false
maxConnections: 4
skipTcpProbe: false
localFile: false
defaultPort: 5432
jdbc:
  driverClass: org.postgresql.Driver
  # sslmode=prefer：能加密就加密、服务器不支持则退回明文；stringtype=unspecified
  # 让未知类型按字符串读而不是抛错；tcpKeepAlive 防长连接被 NAT 静默掐断；
  # reWriteBatchedInserts 把批量 INSERT 合并成多值形式。表单不再暴露这几项。
  urlTemplate: "jdbc:postgresql://{host}:{port}/{database}?sslmode=prefer&reWriteBatchedInserts=true&stringtype=unspecified&tcpKeepAlive=true"
  artifact: org.postgresql:postgresql:42.7.4
traits:
  singleDatabase: false
  schemaAware: true
supportLevel: operate
capabilities:
  queryExecution: true
  metadataBrowse: true
  objectBrowser: true
  objectSource: true
  schemaSearch: true
  diagram: true
  tableDataEdit: true
  tableStructureEdit: true
  tableImport: true
  dataTransfer: true
  sqlFileExecution: true
  databaseCreate: true
  fieldLineage: false
  sqlExplain: true
  userAdmin: true
  driverManagement: true
