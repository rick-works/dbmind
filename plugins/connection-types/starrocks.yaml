schemaVersion: 1
order: 1450
dbType: starrocks
rustVariant: Starrocks
label: StarRocks
# StarRocks 是 Apache Doris 的分叉（早期同源），MySQL 协议兼容层一致：
# 方言分支、模块路由、驱动全部复用 Doris/MySQL 那一套。
dialect: MySQL
runtimeMode: agent
mcpMode: bridge
# 与 Doris 同理：走 MySQL 协议，复用 MySQL 驱动目录与宿主
agentKey: doris
driverStoreVisible: true
driverStoreOrder: 15
singleConnectionPool: false
metadataConnectionScoped: false
# MPP 分析库，并发天然高；连接开销低 → 给 8（判断，非实测）
maxConnections: 8
skipTcpProbe: false
localFile: false
# FE 查询端口 9030（与 Doris 相同）
defaultPort: 9030
jdbc:
  driverClass: com.mysql.cj.jdbc.Driver
  # StarRocks 走 MySQL 协议 + MySQL 驱动，参数与 mysql 同款
  urlTemplate: "jdbc:mysql://{host}:{port}/{database}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=600000&rewriteBatchedStatements=true&useCursorFetch=true&zeroDateTimeBehavior=CONVERT_TO_NULL&allowMultiQueries=true"
  artifact: com.mysql:mysql-connector-j:9.1.0
traits:
  singleDatabase: false
  schemaAware: false
supportLevel: operate
capabilities:
  queryExecution: true
  metadataBrowse: true
  objectBrowser: true
  objectSource: true
  schemaSearch: true
  diagram: true
  tableDataEdit: true
  tableStructureEdit: true
  tableImport: true
  dataTransfer: true
  sqlFileExecution: true
  databaseCreate: true
  fieldLineage: false
  sqlExplain: true
  userAdmin: true
  driverManagement: true
