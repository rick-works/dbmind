<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Oracle">
  <!-- Oracle：数据库（圆柱）形状 —— 与其它类型在树上"长得就是一台数据库"的口径一致。
       以前这里是 Oracle 那个红色圆环 O：在 14px 的树里是一个色块，和旁边 MySQL 的
       数据库图标不是一路的视觉语言（用户点名要改成数据库形状）。
       颜色仍用 Oracle 官方红（#F80000），靠顶面高亮 + 两道盘线做出圆柱的立体感。 -->
  <path d="M16 3C9.94 3 5 5.01 5 7.5v17C5 27 9.94 29 16 29s11-1.99 11-4.5v-17C27 5.01 22.06 3 16 3z" fill="#F80000"/>
  <ellipse cx="16" cy="7.5" rx="11" ry="4.5" fill="#FF6B6B"/>
  <path d="M5 14.3c0 2.49 4.94 4.5 11 4.5s11-2.01 11-4.5" fill="none" stroke="#B30000" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M5 20.7c0 2.49 4.94 4.5 11 4.5s11-2.01 11-4.5" fill="none" stroke="#B30000" stroke-width="1.7" stroke-linecap="round"/>
</svg>
