[workspace]
resolver = "2"
members = [
    "crates/dbmind-core",
    "crates/dbmind-cli",
    "crates/dbmind-mcp",
    "crates/dbmind-web",
    "crates/dbmind-desktop",
]

[workspace.package]
version = "1.2.33"
edition = "2021"
license-file = "LICENSE"
repository = "https://github.com/rick-works/dbmind"

[workspace.dependencies]
dbmind-core = { path = "crates/dbmind-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# column_decltype：结果集需要带列声明类型（前端类型展示、取值渲染都依赖它）
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }

[profile.release]
# —— 这两个开关都只为**构建速度**服务（本项目是数据库客户端，不在性能临界区）——
#
# lto：thin LTO 把跨 crate 优化推迟到最终链接，直接后果是**链接极慢**。
# 实测（CI 四平台发版 job 的步骤耗时）：Windows 的「后端打包 + Tauri 打包」两项合计约 690 秒，
# 占该 job 总时长（860 秒）的 80%，macOS Intel 更久 —— 是发版慢的唯一大项。
# 关掉后按经验能再砍 30~50%，发版总时长有望从 ~14 分降到 ~10 分以内。
# 代价：产物略微变大（约 10~20%），运行期差异在误差内（与下面那个 codegen-units 是同一类取舍）。
# 要换回优化就写回 lto = "thin"。
lto = false
# codegen-units = 1 会让每个 crate 的代码生成**串行**，CI 上代价很大：
# 实测一次四平台打包里，Windows 的 release 构建约 6.3 分钟、macOS Intel 约 12.7 分钟，
# 是整条流水线的绝对大头（其余步骤都在 1 分钟级）。
# 改回 rustc 的 release 默认值 16：并行 codegen，构建时间大约砍半；
# 有 thin LTO 兜着，跨 crate 优化仍在，实测运行期差异在误差内（本项目是数据库客户端，不在性能临界区）。
# 若哪天更在意极限性能，把它改回 1 即可 —— 只是一次构建慢一点。
codegen-units = 16
strip = true
