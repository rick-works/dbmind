[workspace]
resolver = "2"
members = [
    "crates/dbmind-core",
    "crates/dbmind-cli",
    "crates/dbmind-mcp",
    "crates/dbmind-web",
    "crates/dbmind-desktop",
]

[workspace.package]
version = "1.1.1"
edition = "2021"
license-file = "LICENSE"
repository = "https://github.com/rick-works/dbmind"

[workspace.dependencies]
dbmind-core = { path = "crates/dbmind-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# column_decltype：结果集需要带列声明类型（前端类型展示、取值渲染都依赖它）
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
