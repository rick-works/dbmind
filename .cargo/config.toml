# 用工具链自带的 rust-lld 代替 MSVC 的 link.exe。
#
# 为什么：Windows 上默认链接器 link.exe 慢，而 dev（debug = 2）构建还要写一个
# **168 MB 的 PDB**，那正是「改一行也要等一两分钟」的主要来源（`cargo build` 的
# 链接阶段没有任何输出，看起来像卡死）。rust-lld 快得多，且不用额外安装。
#
# 只影响「最终链接」这一步 —— 依赖的编译产物仍然有效，因此**不会**触发全量重编。
#
# 注意：下面这条路径是**本机**的（rustup stable 工具链），换机器需要改成对应路径，
# 或者直接删掉本文件退回默认链接器（不影响构建正确性，只是慢一些）。
[target.x86_64-pc-windows-msvc]
linker = "C:\\Users\\Rick\\.rustup\\toolchains\\stable-x86_64-pc-windows-msvc\\lib\\rustlib\\x86_64-pc-windows-msvc\\bin\\rust-lld.exe"
