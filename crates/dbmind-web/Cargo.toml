[package]
name = "dbmind-web"
description = "DBmind HTTP 壳（axum，可同时托管前端产物）"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dbmind-web"
path = "src/main.rs"

[dependencies]
dbmind-core = { workspace = true }
# 系统标准目录（在线更新的安装包默认落到「下载」）。自己拼 %USERPROFILE%\Downloads 不行：
# Windows 上「下载」常被重定向到别的盘或 OneDrive，只有 Known Folder API 拿得到真实路径
dirs = "6"
serde_json = { workspace = true }
# 任务 id 与产物文件名里的时间戳（本地时区，用户看文件名就知道什么时候导的）
chrono = { workspace = true }
# multipart：导入数据要走 `multipart/form-data` 上传文件（前端用 FormData 发）
axum = { version = "0.8", features = ["multipart"] }
# zip：Excel(.xlsx) 与整库多文件导出本质都是 zip 容器，自己拼容器不如用标准实现
zip = { version = "2", default-features = false, features = ["deflate"] }
# SSE：AI 流式回答是「阻塞的读上游+ 异步地推给浏览器」，用 channel 接一下最省事
tokio-stream = { version = "0.1", features = ["sync"] }
# 正则：数据治理的「格式/邮箱/手机号/身份证」等规则要在**本地**判定敏感字段名，
# 以及在没有正则能力的方言上做兜底校验（SQL 侧能做的优先交给 SQL）
regex = "1"
# 下载驱动用（与 CLI 同一个客户端）：内核刻意不引网络依赖，下载由壳层做。
ureq = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "process", "fs", "io-util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "compression-br", "compression-gzip", "compression-deflate"] }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# AI 出站脱敏要的「常用加密方式」：MD5 / SHA-256 摘要 + AES-256-GCM 加密。
# 三者都只用来把出站值换成不可读/可解的形式，不参与存储加密，所以不需要更多密码学设施。
md-5 = "0.11"
sha2 = "0.10"
# ring 只用于 AES-256-GCM 与生成 32 字节密钥：ureq/rustls 已经把它带进来了，加直接依赖不再多编译一份
ring = "0.17"
base64 = "0.22"
