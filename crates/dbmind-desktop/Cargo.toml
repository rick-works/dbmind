[package]
name = "dbmind-desktop"
description = "DBmind 桌面壳（Tauri：内嵌 HTTP 内核 + 系统 WebView）"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[[bin]]
name = "dbmind-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 桌面壳不直接依赖内核，而是依赖 **HTTP 壳**并用它的 `spawn_embedded`：
# 前端整份代码都按 HTTP 契约写（见 api/index.js 的空 baseURL），
# 让桌面走同一份契约，Web 版与桌面版才不会各漂各的。
dbmind-web = { path = "../dbmind-web" }
# 只为了 `hide_console`（Windows 上别给子进程弹控制台）：桌面壳自己会 spawn
# `java -version` 探测版本，不藏的话每次开软件都闪一个黑窗。函数本体在 core。
dbmind-core = { path = "../dbmind-core" }
# tray-icon：关闭窗口时给"最小化到托盘"用（没有托盘就没法把那扇窗叫回来）
tauri = { version = "2", features = ["tray-icon"] }
# 系统原生「打开文件 / 选择目录」对话框：桌面版选备份文件、SQLite/H2/Derby 数据库文件时弹系统文件管理器。
# 页面里那套自绘目录浏览器只为**浏览器版**保留（浏览器拿不到本机绝对路径，只能让后端列目录）。
tauri-plugin-dialog = "2"
# 退出清场时枚举进程（拿可执行文件路径与命令行做严格匹配）。
# 刻意不用 tasklist / wmic / PowerShell：打包后的便携版里没有脚本，
# 而这些外部工具在新系统上有的已弃用、有的行为不一致。
sysinfo = "0.32"
